name: Django tests

on:
  # disabled on push for now; run manually from the Actions tab
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests on Django
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare .env
        run: |
          cp env.SAMPLE .env
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env

      - name: Build image
        run: docker compose build django

      - name: Fix folder permissions
        run: |
          docker compose run --rm fix-permissions
          ls -lnd static app-data/media

      - name: Start database
        run: docker compose up -d --wait db

      - name: Run tests
        run: >
          docker compose run --rm --no-deps -T --entrypoint python django
          manage.py test --noinput -v 2

      - name: Show container state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
          free -m
          sudo dmesg | grep -iE "killed process|out of memory" || true
