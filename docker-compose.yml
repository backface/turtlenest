services:

  memcached:
    image: memcached
    restart: unless-stopped
    
  db:
    image: pgvector/pgvector:pg16
    env_file:
      - '.env'
    volumes:
      - ${APP_DATA_DIR?./app-data}/postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 30s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  django:
    image: backface/turtlenest:latest
    build:
      context:  ./
      dockerfile: Dockerfile
      args:
        DOCKER_BUILDKIT: 1      
    env_file:
      - '.env'      
    depends_on:
      - db
    networks:
      # - public_proxy
      - default      
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:$${PORT:-8000}/alive', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - ${APP_DATA_DIR?./app-data/}/media:/app/app-data/media
      - ./static:/app/static
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db-backup:
    image: pgvector/pgvector:pg16
    env_file:
      - '.env'
    volumes:
      - ${APP_DATA_DIR?./app-data}/postgres-backup:/backup
    restart: unless-stopped
    # hourly dump, keeps the newest BACKUP_KEEP (default 3), files created with
    # BACKUP_UMASK (default 077: root only; 022 = world-readable as before);
    # <db>-dump.sql always points to the newest complete dump
    command:
      - sh
      - -c
      - |
        umask "$${BACKUP_UMASK:-077}"
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        keep="$${BACKUP_KEEP:-3}"
        latest="/backup/$$POSTGRES_DB-dump.sql"
        while true; do
          file="/backup/$$POSTGRES_DB-dump-$$(date +%Y%m%d-%H%M).sql"
          echo "$$(date) starting dump of $$POSTGRES_DB"
          if pg_dump -h db -U "$$POSTGRES_USER" -c "$$POSTGRES_DB" > "$$file.tmp"; then
            mv "$$file.tmp" "$$file"
            ln -sfn "$$(basename "$$file")" "$$latest"
            ls -1 /backup/"$$POSTGRES_DB"-dump-*.sql | sort -r | tail -n +"$$((keep + 1))" | xargs -r rm -f
            echo "$$(date) finished $$file"
          else
            rm -f "$$file.tmp"
            echo "$$(date) dump of $$POSTGRES_DB FAILED"
          fi
          sleep 3600
        done
    depends_on: 
      - db

